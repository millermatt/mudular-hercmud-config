# Shared combat config for the mathias (warrior) / saihtam (cleric) duo.
#
# Everything symmetric lives here; the asymmetric halves — mathias drives,
# saihtam executes — live in the two profiles.
#
# FLEEING IS THE SERVER'S JOB. Type `wimpy` once on each character and it
# auto-flees the instant damage drops it below max_hp/3 — measured against
# the real maximum, with no client round-trip and nothing to tune. There is
# deliberately no client-side flee threshold here; the rules only *react* to
# the server's own "You wimp out" so the other character comes along.
#
# HEALING LIVES IN duo.lua: the thresholds as fractions of each character's
# maximum, and the spell choice as a ladder the cleric discovers from the
# server's own refusals. Nothing here needs retuning when either of you
# levels or practises something new.
name: hercmud-combat
description: Shared combat config

# Loaded by both characters; each session gets its own VM.
scripts:
  - duo.lua

variables:
  target: none

  # Cooldown latches. A rule sets one to stop itself repeating every combat
  # round; the duo-cooldowns timer clears them all a few seconds later, so
  # nothing can wedge on a message that never arrives.
  healing: 0
  assisting: 0
  self_healing: 0
  retrying: 0

aliases:
  - regex: gac
    send: ["get all corpse"]
  # `jc` — clear a corpse you are done with. Manual on purpose, and worth
  # keeping that way.
  #
  # Every corpse on this server is ITEM_WEAR_TAKE, player corpses included
  # (fight.c make_corpse: the only PC difference is a decay timer), and
  # extract_obj recurses into a container's contents. So junking a corpse
  # destroys whatever is inside it. On a *player's* corpse that is their
  # equipment and the experience their death cost them, because
  # GET_OBJ_COST(corpse) carries that exp for recover_corpse_exp() to give
  # back. Automate this on a `is dead!` trigger and you will eventually junk a
  # groupmate's corpse while they are running back to it.
  #
  # `sacrifice` pays a flat 5 gold; `junk` pays cost/16, floored at 1 and
  # capped at 200. A mob corpse costs nothing, so sacrifice is the better of
  # the two there — 5 against 1.
  - regex: '^jc$'
    send: ["get corpse", "junk corpse"]

  # `sc` — 5 gold instead of 1 for a mob corpse. Same warning as above: this
  # destroys the corpse and everything in it.
  - regex: '^sc$'
    send: ["sacrifice corpse"]

triggers:
  # fight.c prints "$n is dead!  R.I.P." with TWO spaces after the bang.
  - id: autoloot
    regex: '^(?P<who>.+) is dead!  R\.I\.P\.$'
    when: '${who} != "Mathias" and ${who} != "Saihtam"'
    send: ["get all corpse"]

  # Share the gold the moment it is picked up. The server prints this from
  # get_check_money (act.obj.c) and only when the pile is more than one coin,
  # so there is no singular "1 coin" wording to match -- a lone coin is
  # silent and simply stays yours.
  #
  # Anchored deliberately: unanchored, somebody gossiping "There were 500
  # coins." would make you hand over gold you never found.
  - id: split-loot
    regex: '^There were (?P<coins>\d+) coins\.$'
    send: ["split ${coins}"]

  # do_split needs AFF_GROUP, so playing solo this replies every single time
  # a corpse pays out. The split itself is harmless -- nothing is lost -- but
  # the complaint is not news. Note the remainder stays with you: `share =
  # amount / num` is integer division, so splitting 7 two ways gives 3 each
  # and you keep the odd coin.
  - id: gag-split-solo
    regex: '^With whom do you wish to share your gold\?$'
    gag: true

  # Same line, unguarded: whatever died, this fight is over, so drop the
  # latches rather than waiting out the timer.
  - id: fight-over
    regex: ' is dead!  R\.I\.P\.$'
    set:
      healing: "0"
      assisting: "0"
      self_healing: "0"
      retrying: "0"

  - id: fled
    regex: '^You flee head over heels\.$'
    set:
      healing: "0"
      assisting: "0"
      self_healing: "0"

  # Re-target whatever just hit us, so `k` re-engages after an ambush
  # instead of swinging at a stale name. A heuristic, not a fact: the
  # server sends a short description ("the large goblin"), and the last
  # word of one is usually — not always — the keyword `kill` wants. Worst
  # case is "No-one by that name here.", so `t` remains the way to be sure.
  #
  # (There is nothing better to key on: no message on this server says
  # "you are now fighting X", and MSDP never reports OPPONENT_NAME because
  # comm.c's msdp_update only ever sets the self-vitals block.)
  - id: track-target
    regex: '^.*?(?P<foe>\w+) (?:tail whips|miss|tickles|hits|stings|whips|slashes|bites|bludgeons|crushes|pounds|claws|mauls|thrashes|pierces|blasts|punches|stabs|gores|massacres|obliterates|liquifies|vaporizes|annihilates|ATOMIZES) you\b'
    set:
      target: "${foe}"

  # Harmless cross-talk from an assist that arrived a beat early or late.
  # Gagged rather than removed: the retry is what makes the duo robust, and
  # its failures are not news.
  - id: gag-assist-early
    regex: '^But they are not fighting anyone\.$'
    gag: true
  - id: gag-assist-late
    regex: '^But you are already fighting someone!$'
    gag: true

timers:
  - id: autosave
    every: 5m
    send: ["save"]

  # The only thing keeping a latch from being permanent. No traffic — it
  # sends nothing.
  - id: duo-cooldowns
    every: 3s
    set:
      healing: "0"
      assisting: "0"
      self_healing: "0"
      retrying: "0"
