# mathias — warrior, and the pane you drive the duo from.
#
# Every key you press lives here. saihtam is commanded through `send_to:`,
# which injects the command into his session — and because his profile opts
# into `expand_aliases`, the short tokens below (`ch`) reach his own aliases
# rather than the server.
#
# This file names no healing spell anywhere. Asking is mathias' job; choosing
# is saihtam's, in modules/duo.lua, where his mana and learned spells are
# actually visible.
name: mathias
login:
  name: mathias
host: hercmud.net
port: 4443
tls:
  enabled: true
  verify: full        # full | pinned | insecure
charset: utf-8          # or a legacy fallback: latin1, cp437
color: cyan             # pane border + tab colour
modules:
  - hercmud-combat
  - hercmud-health

aliases:
  # --- driving ---------------------------------------------------------
  # `t goblin` picks a target without attacking. Your own typed line is
  # the confirmation — the server's `echo` is a wizard command, so there
  # is nothing safe to print back.
  - regex: '^t (.+)$'
    set:
      target: "${1}"

  # `k` engages the current target. The assist is sent here *and* driven
  # off combat output below, because a lone `send_to` here loses a race
  # it cannot win: the server puts the newest connection at the head of
  # descriptor_list, so if saihtam connected second his `assist` runs
  # before this `kill` in the same pulse and fails. The output-driven
  # copy always lands, one round later at worst.
  - regex: '^k$'
    send: ["kill ${target}"]
    send_to:
      saihtam: ["assist mathias"]

  # `kk goblin` — target and engage in one.
  - regex: '^kk (.+)$'
    set:
      target: "${1}"
    send: ["kill ${1}"]
    send_to:
      saihtam: ["assist mathias"]

  # --- healing ---------------------------------------------------------
  # `h` — heal me now, whatever my HP says. Names no spell: saihtam's
  # `ch` picks the right rung for the size of the hole.
  - regex: '^h$'
    send_to:
      saihtam: ["ch"]

  # `hh` — the big one, out of combat only: `heal` is standing-only and
  # costs 125 mana, so it is a between-fights top-up, not a rescue.
  - regex: '^hh$'
    send_to:
      saihtam: ["stand", "cast 'heal' mathias"]

  # --- keeping the two of us together ---------------------------------
  # `f` — break off, both of us. saihtam may land in a different room;
  # `grp` puts you back together.
  - regex: '^f$'
    send: ["flee"]
    send_to:
      saihtam: ["flee"]

  # `grp` — re-form the group after a flee, a death, or a reconnect.
  # groupnet needs AFF_GROUP, so this is also what makes `gn` work.
  - regex: '^grp$'
    send: ["group saihtam"]
    send_to:
      saihtam: ["follow mathias"]

  - regex: '^rr$'
    send: ["rest"]
    send_to:
      saihtam: ["rest"]

  - regex: '^ss$'
    send: ["stand"]
    send_to:
      saihtam: ["stand"]

  # `bb` — pre-fight buff. Standing-only, so cast it before you engage.
  - regex: '^bb$'
    send_to:
      saihtam: ["stand", "cast 'bless' mathias"]

triggers:
  # --- reacting to a round ---------------------------------------------
  # The anchor is every message the server sends *me* when something hits
  # me (fight.c dam_message, the to_victim column) — one line per incoming
  # attack, which is the closest thing to a per-round clock a client gets.
  # The YAML anchor below reuses the same pattern for the rules that share
  # it rather than repeating 300 characters of alternation.
  - id: heal-call
    regex: &incoming '(?:\b(?:miss|tickles|hits|stings|whips|slashes|bites|bludgeons|crushes|pounds|claws|mauls|thrashes|pierces|blasts|punches|stabs|gores|massacres|obliterates|liquifies|vaporizes|annihilates|ATOMIZES) you\b|^You staggers from a fearsome )'
    when: '${healing} == 0'
    script:
      file: duo.lua
      fn: call_heal

  # Whichever of us swung first, the cleric joins in. Guarded by a latch
  # so it is one command per fight, not one per round; the module gags the
  # "already fighting" reply either way.
  - id: assist-call
    regex: *incoming
    when: '${assisting} == 0'
    send_to:
      saihtam: ["assist mathias"]
    set:
      assisting: "1"

  # The same call for a fight I started against something that has not
  # hit back yet (fight.c dam_message, the to_char column).
  - id: assist-call-outgoing
    regex: '^You (?:miss|tickle|barely |hit|sting|whip|slash|bite|bludgeon|crush|pound|claw|maul|thrash|pierce|blast|punch|stab|gore|tail whip|massacre|obliterate|liquify|vaporize|annihilate|ATOMIZE)'
    when: '${assisting} == 0'
    send_to:
      saihtam: ["assist mathias"]
    set:
      assisting: "1"

  # --- trouble ---------------------------------------------------------
  # The server bailed me out on its own. Pull saihtam out too, or he is
  # left alone with whatever I was holding.
  - id: wimped-out
    regex: '^You wimp out, and attempt to flee!$'
    send_to:
      saihtam: ["flee"]
    set:
      healing: "0"
      assisting: "0"
    bell: true

  - id: flee-failed
    regex: '^PANIC!  You couldn''t escape!$'
    bell: true

  # Below zero and losing HP every tick. Deliberately un-latched: a cure
  # spell has POS_FIGHTING as its minimum for the *caster*, so saihtam can
  # still heal a target who can no longer act, and this is the one moment
  # worth spending mana on every single line.
  - id: incapacitated
    regex: '^You are (?:mortally wounded, and will die soon|incapacitated and will slowly die), if not aided\.$'
    send_to:
      saihtam: ["ch"]
    bell: true

  # Remembers the room for `/corpse` to walk back to. The server wakes the
  # dead at the start room, so this is the only record of where the body is.
  - id: died
    regex: '^You are dead!  Sorry\.\.\.$'
    corpse: true
    bell: true
    send_to:
      saihtam: ["flee"]
    set:
      healing: "0"
      assisting: "0"

  - id: partner-died
    regex: '^Your blood freezes as you hear Saihtam''s death cry\.$'
    bell: true
    highlight:
      fg: red
      bold: true
      whole_line: true

  - regex: '^You are hungry\.$'
    send: ["eat bread"]
